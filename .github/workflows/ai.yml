name: AI Coder
on:
  issues:
    types: [opened]
jobs:
  ai_edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ github.event.issue.body }}
        run: node .github/scripts/ai.js
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: AI Update
          title: "AI Update for Issue #${{ github.event.issue.number }}"
          body: "Generated by AI."
          branch: ai-update-${{ github.event.issue.number }}
